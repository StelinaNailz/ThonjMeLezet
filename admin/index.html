<!DOCTYPE html>
<html lang="sq">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stelina | Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #f8f4ee;
            color: #302a26;
            font-family: "Inter", sans-serif;
            min-height: 100vh;
        }


        /* =========================
           LOGIN
        ========================= */

        #loginPage {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: #fffdf9;
            padding: 45px 30px;
            border: 1px solid #e9dfd2;
            text-align: center;
        }

        .login-logo {
            font-family: "Cormorant Garamond", serif;
            font-size: 42px;
            letter-spacing: 4px;
            margin-bottom: 5px;
        }

        .login-subtitle {
            color: #6b594d;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 35px;
        }

        .login-box input {
            width: 100%;
            padding: 15px;
            border: 1px solid #b9aa9b;
            background: #f8f4ee;
            font-family: "Inter", sans-serif;
            font-size: 14px;
            outline: none;
            margin-bottom: 15px;
        }

        .login-box input:focus {
            border-color: #6b594d;
        }

        .login-button {
            width: 100%;
            padding: 15px;
            border: none;
            background: #6b594d;
            color: #fffdf9;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
        }

        .login-button:hover {
            background: #302a26;
        }

        #errorMessage {
            color: #9b4b4b;
            font-size: 13px;
            margin-top: 15px;
            display: none;
        }


        /* =========================
           ADMIN PANEL
        ========================= */

        #adminPage {
            display: none;
        }

        header {
            padding: 25px;
            border-bottom: 1px solid #e9dfd2;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: "Cormorant Garamond", serif;
            font-size: 30px;
            letter-spacing: 3px;
        }

        .admin-text {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #6b594d;
        }

        main {
            width: 100%;
            max-width: 600px;
            margin: auto;
            padding: 50px 25px;
        }

        .welcome h1 {
            font-family: "Cormorant Garamond", serif;
            font-size: 42px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .welcome p {
            color: #6b594d;
            margin-bottom: 35px;
        }

        .section-title {
            font-family: "Cormorant Garamond", serif;
            font-size: 27px;
            margin-bottom: 15px;
        }

        #date {
            width: 100%;
            padding: 15px;
            border: 1px solid #b9aa9b;
            background: #fffdf9;
            font-family: "Inter", sans-serif;
            font-size: 15px;
            margin-bottom: 30px;
        }


        /* =========================
           ORARET
        ========================= */

        .times {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }

        .time {
            padding: 15px 5px;
            border: 1px solid #b9aa9b;
            background: #e9dfd2;
            color: #302a26;
            cursor: pointer;
            font-family: "Inter", sans-serif;
            font-size: 14px;
            transition: 0.2s;
        }

        .time:hover {
            border-color: #6b594d;
            transform: translateY(-2px);
        }

        .time.active {
            background: #9b4b4b !important;
            color: white !important;
            border-color: #9b4b4b !important;
        }

        .time.active:hover {
            background: #9b4b4b !important;
            transform: none;
        }


        /* =========================
           SAVE
        ========================= */

        .save-button {
            width: 100%;
            padding: 17px;
            background: #6b594d;
            color: #fffdf9;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 13px;
        }

        .save-button:hover {
            background: #302a26;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .times {
                grid-template-columns: repeat(2, 1fr);
            }

            .welcome h1 {
                font-size: 36px;
            }

        }

    </style>
</head>


<body>


    <!-- =========================
         LOGIN PAGE
    ========================= -->

    <div id="loginPage">

        <div class="login-box">

            <div class="login-logo">
                STELINA
            </div>

            <div class="login-subtitle">
                Admin
            </div>

            <input
                type="password"
                id="password"
                placeholder="Fjalëkalimi"
            >

            <button
                class="login-button"
                id="loginButton"
            >
                Hyr
            </button>

            <p id="errorMessage">
                Fjalëkalimi është i gabuar.
            </p>

        </div>

    </div>


    <!-- =========================
         ADMIN PAGE
    ========================= -->

    <div id="adminPage">

        <header>

            <div class="logo">
                STELINA
            </div>

            <div class="admin-text">
                Admin
            </div>

        </header>


        <main>

            <div class="welcome">

                <h1>
                    Menaxho rezervimet
                </h1>

                <p>
                    Orari yt.
                </p>

            </div>


            <div class="section-title">
                Zgjidh datën
            </div>

            <input
                type="date"
                id="date"
            >


            <div class="section-title">
                Oraret
            </div>


            <div class="times">

                <button type="button" class="time" data-time="08:00">08:00</button>
                <button type="button" class="time" data-time="09:00">09:00</button>
                <button type="button" class="time" data-time="10:00">10:00</button>
                <button type="button" class="time" data-time="11:00">11:00</button>
                <button type="button" class="time" data-time="12:00">12:00</button>
                <button type="button" class="time" data-time="13:00">13:00</button>
                <button type="button" class="time" data-time="14:00">14:00</button>
                <button type="button" class="time" data-time="15:00">15:00</button>
                <button type="button" class="time" data-time="16:00">16:00</button>
                <button type="button" class="time" data-time="17:00">17:00</button>
                <button type="button" class="time" data-time="18:00">18:00</button>
                <button type="button" class="time" data-time="19:00">19:00</button>
                <button type="button" class="time" data-time="20:00">20:00</button>
                <button type="button" class="time" data-time="21:00">21:00</button>

            </div>


            <button
                class="save-button"
                id="saveButton"
            >
                Ruaj orarin
            </button>

        </main>

    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="admin.js"></script>

</body>

</html>
